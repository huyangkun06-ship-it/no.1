<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafaf8"><title>838 · 知识体系</title>
<link rel="icon" href="../icon.svg"><link rel="stylesheet" href="../styles.css?v=smart-20261111-1">
<link rel="stylesheet" href="./vendor/katex.min.css"><link rel="stylesheet" href="./knowledge.css">
<script defer src="./vendor/katex.min.js"></script><script defer src="./knowledge.js"></script>
</head>
<body>
<a class="skip-link" href="#reader">跳到正文</a>
<header class="k-header"><a class="k-brand" href="../">838</a><span class="k-divider">/</span><strong>知识体系</strong><a class="k-old" href="../">返回背诵复习 ↗</a></header>
<main class="k-main">
<div class="k-toolbar"><div class="k-subjects" role="group" aria-label="切换科目"><button data-subject="environment-intro" aria-pressed="true">环境学导论</button><button data-subject="water-pollution" aria-pressed="false">水污染控制工程</button></div><div class="k-tools"><button id="coverageBtn">资料覆盖</button><button id="exportBtn">导出知识数据</button></div></div>
<div class="k-modes" role="group" aria-label="学习视角"><button id="directoryBtn" aria-expanded="true" aria-controls="directory">☰ 目录</button><button data-mode="map" id="mapMode" aria-pressed="true">思维导图</button><button data-mode="tree" aria-pressed="false">交互知识树</button><button data-mode="read" aria-pressed="false" id="readMode">专注阅读</button><button data-mode="recall" aria-pressed="false">闭卷抽背</button><button data-mode="compare" aria-pressed="false" id="compareMode" hidden>工艺对比</button></div>
<div id="message" role="status" aria-live="polite">正在加载知识资料…</div>
<div class="k-layout" id="layout">
<aside id="directory" class="k-directory" aria-label="知识树目录"><div class="k-directory-head"><strong id="treeSubject">环境学导论</strong><button id="closeDirectory" aria-label="关闭目录">✕</button></div>
<label for="treeSearch">搜索标题与正文</label><div class="k-search-row"><input id="treeSearch" type="search" placeholder="搜索知识点…" autocomplete="off"><button id="clearSearch" aria-label="清除搜索">✕</button></div>
<div class="k-search-nav" id="searchNav" hidden><span id="searchCount"></span><button id="prevMatch" aria-label="上个搜索结果">↑</button><button id="nextMatch" aria-label="下个搜索结果">↓</button></div>
<label for="depth">展开深度</label><select id="depth"><option value="0">仅章节</option><option value="1">章节 + 小节</option><option value="2" selected>显示知识点标题</option><option value="3">显示答题框架</option><option value="all">全部展开</option></select>
<div class="k-tree-tools"><button id="expandAll">全部展开</button><button id="collapseAll">全部折叠</button><button id="resetTree">恢复默认</button></div>
<details class="k-branch-tools"><summary>当前分支与自选范围</summary><div class="k-tree-tools"><button id="expandBranch">展开全部后代</button><button id="collapseBranch">折叠全部后代</button><button id="pickBranch">勾选分支知识点</button><button id="clearPicks">清空自选</button></div><p id="pickCount" class="mini">已选 0 项</p></details>
<div id="treeViewport" class="k-tree-viewport" role="tree" aria-label="可独立展开的知识树" tabindex="0"><div id="treeRows"></div></div><p class="k-keyboard">← → 展开收起 · ↑ ↓ 移动 · Enter 阅读</p>
</aside>
<button id="drawerBackdrop" class="k-backdrop" aria-label="关闭目录" hidden></button>
<article id="reader" class="k-reader" tabindex="-1"><div class="k-reader-top"><button id="backRead" disabled>← 返回上一阅读位置</button><button id="locateBtn">定位目录</button></div><nav id="breadcrumbs" class="k-breadcrumbs" aria-label="知识路径"></nav><div id="readingBody"></div><footer id="readerFooter" class="k-reader-footer"><button id="prevTopic">← 上一知识点</button><button id="topBtn">返回顶部 ↑</button><button id="nextTopic">下一知识点 →</button></footer></article>
</div>
</main>
<dialog id="coverageDialog"><div class="k-dialog-head"><h2>资料覆盖与核对</h2><button id="closeCoverage" aria-label="关闭报告">✕</button></div><div id="coverageSummary"></div><label for="coverageSearch">查找原知识点、章节或ID</label><input id="coverageSearch" type="search" placeholder="输入名称、章节或节点ID"><label for="coverageStatus">核对状态</label><select id="coverageStatus"><option value="all">全部</option><option value="verified">已完成且核对</option><option value="migrated_pending">已迁移但待核对</option><option value="source_incomplete">来源不完整</option><option value="not_migrated">尚未迁移</option></select><div id="coverageRows"></div><div class="k-tree-tools"><button id="coveragePrev">上一页</button><span id="coveragePage"></span><button id="coverageNext">下一页</button><button id="coverageExport">下载完整覆盖报告</button></div></dialog>
<noscript>知识体系需要启用JavaScript；原始结构化资料位于 data/ 目录。</noscript>
</body></html>
